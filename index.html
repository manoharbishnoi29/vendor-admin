<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Admin</title>
<style>
:root{--p:#3b3fd8;--ink:#151826;--bg:#f2f4f7;--mut:#6b7285;--line:#d9dde6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:14px}
input,select,button{padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;margin:4px 0;background:#fff;color:var(--ink)}
input,select{width:100%}
button{background:var(--p);color:#fff;border:0;cursor:pointer;margin-right:6px}
button.g{background:#fff;color:var(--p);border:1px solid var(--p)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.nav button{background:#e6e9f0;color:var(--ink)}.nav button.on{background:var(--p);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:#fff;padding:16px;border-radius:10px;font-size:14px;color:var(--mut)}
.stats b{display:block;font-size:30px;color:var(--ink)}
.c{background:#fff;padding:12px;border-radius:10px;margin:8px 0}
.im{display:flex;gap:6px;overflow-x:auto}.im img{height:110px;border-radius:8px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bar span{width:44px;color:var(--mut)}.bar i{display:block;height:14px;background:var(--p);border-radius:4px;min-width:2px}
.msg{background:#eef0f6;padding:8px 12px;border-radius:10px;margin:2px 0 8px;display:inline-block;max-width:90%;word-break:break-word}
small{color:var(--mut)}
label{font-size:13px;color:var(--mut)}
video{max-width:100%;max-height:260px;border-radius:8px;background:#000}
.ov{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:700px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}
.sheet button{margin:6px 6px 0 0}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, getCountFromServer, serverTimestamp, Timestamp, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s), R = $("#root");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEF_CATS = ["Mobiles", "Vehicles", "Electronics", "Furniture", "Fashion", "Books", "Others"];
const comm = p => Math.round(p.amount * (p.commissionPercent ?? 5)) / 100;
const dt = p => p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString("en-IN") : "";
let V;

function loginView(msg = "") {
  R.innerHTML = `<h2>Vendor Admin Login</h2><p style="color:red">${esc(msg)}</p>
  <input id="e" type="email" placeholder="Admin email"><input id="p" type="password" placeholder="Password">
  <button id="li">Login</button>`;
  $("#li").onclick = async () => {
    try { await signInWithEmailAndPassword(auth, $("#e").value, $("#p").value); }
    catch (e) { loginView("Email ya password galat hai"); }
  };
}

onAuthStateChanged(auth, async u => {
  if (!u) return loginView();
  const s = await getDoc(doc(db, "users", u.uid));
  if (!s.exists() || s.data().role !== "admin") { await signOut(auth); return loginView("Ye account admin nahi hai"); }
  R.innerHTML = `<h2>Vendor Admin</h2><div class="nav" id="nv">
  <button data-t="dash">📊 Dashboard</button><button data-t="ads">📝 Ads</button>
  <button data-t="users">👥 Users</button><button data-t="cats">🗂 Categories</button>
  <button data-t="pay">💳 Payments</button><button data-t="earn">💰 Meri Kamai</button>
  <button data-t="chats">💬 Chats</button><button data-t="prem">⭐ Premium</button><button data-t="rec">♻️ Recover</button><button data-t="set">⚙️ Settings</button>
  <button class="g" id="lo">Logout</button></div><div id="v"></div>`;
  V = $("#v");
  $("#lo").onclick = () => signOut(auth);
  const tabs = { dash, ads: () => adsTab("pending"), users: usersTab, cats: catsTab, pay: () => payTab("pending"), earn: earnTab, chats: chatsTab, prem: premTab, rec: recTab, set: setTab };
  $("#nv").onclick = async e => {
    const t = e.target.dataset.t; if (!t) return;
    document.querySelectorAll("#nv button").forEach(b => b.classList.toggle("on", b === e.target));
    V.onclick = null; V.innerHTML = "Loading...";
    try { await tabs[t](); }
    catch (x) { V.innerHTML = `<p style="color:red"><b>Error (${esc(t)}):</b> ${esc(x.message)}</p>
      <p><small>Ye admin page is Firebase project se juda hai: <b>${esc(firebaseConfig.projectId)}</b><br>Login: <b>${esc(auth.currentUser?.email)}</b></small></p>
      <p><small>Firebase console mein bilkul yahi project (<b>${esc(firebaseConfig.projectId)}</b>) kholkar Firestore Database → Rules mein firestore.rules paste karo aur Publish dabao.</small></p>`; }
  };
  $("#nv button").click();
});

/* ---------- helpers: modal, date, chat ---------- */
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const fmtD = x => x ? x.split("-").reverse().join("/") : "-";
function modal(html) {
  const ov = document.createElement("div"); ov.className = "ov"; ov.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(ov);
  return ov;
}
function askDate(title, def) {
  return new Promise(res => {
    const ov = modal(`<h3>${esc(title)}</h3><input type="date" id="dtv" min="${ymd(new Date())}" value="${esc(def || "")}"><button id="dok">Save</button><button class="g" id="dno">Cancel</button>`);
    ov.querySelector("#dno").onclick = () => { ov.remove(); res(null); };
    ov.querySelector("#dok").onclick = () => { const v = ov.querySelector("#dtv").value; if (!v) return alert("Date chuno"); ov.remove(); res(v); };
  });
}
async function openChatWith(uid, uname) {
  const aid = auth.currentUser.uid, cid = [aid, uid].sort().join("_");
  const myName = (await getDoc(doc(db, "users", aid))).data()?.name || "Admin";
  try { await setDoc(doc(db, "chats", cid), { participants: [aid, uid].sort(), names: { [aid]: myName, [uid]: uname } }, { merge: true }); }
  catch (x) { return alert("Chat nahi khuli: " + x.message); }
  const ov = modal(`<div style="display:flex;justify-content:space-between;align-items:center"><b>💬 ${esc(uname)}</b><button class="g" id="cx">Band karo</button></div>
  <div id="cm" style="height:45vh;overflow-y:auto;background:#f2f4f7;border-radius:8px;padding:8px;margin:8px 0"></div>
  <div style="display:flex;gap:6px"><input id="ci" placeholder="Message likho..."><button id="cs">Send</button></div>`);
  const stop = onSnapshot(query(collection(db, "chats", cid, "messages"), orderBy("createdAt")), s => {
    const box = ov.querySelector("#cm");
    box.innerHTML = s.docs.map(d => {
      const m = d.data(), mine = m.from === aid;
      const body = m.type === "ad" ? "📎 Ad: " + esc(m.adTitle) : m.type === "img" ? `<img src="${m.img}" style="max-width:180px;border-radius:6px" alt="">` : m.type === "video" ? `<video controls src="${esc(m.url)}"></video>` : esc(m.text);
      return `<div style="text-align:${mine ? "right" : "left"}"><span class="msg" style="${mine ? "background:#3b3fd8;color:#fff" : ""}">${body}</span></div>`;
    }).join("");
    box.scrollTop = 1e9;
  }, () => {});
  ov.querySelector("#cx").onclick = () => { stop(); ov.remove(); };
  const send = async () => {
    const i = ov.querySelector("#ci"), t = i.value.trim(); if (!t) return; i.value = "";
    try {
      await setDoc(doc(db, "chats", cid), { lastMessage: t, updatedAt: serverTimestamp() }, { merge: true });
      await addDoc(collection(db, "chats", cid, "messages"), { from: aid, type: "text", text: t, createdAt: serverTimestamp() });
    } catch (x) { alert("Send nahi hua: " + x.message); }
  };
  ov.querySelector("#cs").onclick = send;
  ov.querySelector("#ci").onkeydown = e => { if (e.key === "Enter") send(); };
}
function paySellerSheet(id, p, sd, after) {
  const c = comm(p), pay = Math.round((p.amount - c) * 100) / 100, upi = sd?.upi || "";
  const link = upi ? `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(p.sellerName)}&am=${pay}&cu=INR&tn=${encodeURIComponent("Vendor payout " + (p.adTitle || "").slice(0, 30))}` : "";
  const ov = modal(`<h3>Seller ko pay karo</h3>
  <p><b>${esc(p.sellerName)}</b> • 📱 ${esc(sd?.phone || "-")}<br>Amount: <b>₹${pay}</b> (₹${p.amount} - commission ₹${c})<br>UPI ID: <b>${esc(upi) || "(seller ne UPI nahi diya)"}</b></p>
  ${upi ? `<a href="${link}" style="display:block;text-align:center;background:#3b3fd8;color:#fff;padding:12px;border-radius:8px;text-decoration:none">UPI app kholo aur pay karo</a>` : `<p style="color:#c0392b">Seller se chat karke UPI ID mangwao.</p><button id="cs2">💬 Seller se chat karo</button>`}
  <input id="su" placeholder="Pay karne ke baad UPI Transaction ID (optional)" style="margin-top:8px">
  <button id="sdn">✅ Pay ho gaya: Settled mark karo</button><button class="g" id="sx">Band karo</button>`);
  ov.querySelector("#sx").onclick = () => ov.remove();
  if (ov.querySelector("#cs2")) ov.querySelector("#cs2").onclick = () => openChatWith(p.sellerId, p.sellerName);
  ov.querySelector("#sdn").onclick = async () => {
    if (!confirm("Seller ko paisa bhej diya? Isse payment 'settled' ho jayegi.")) return;
    try { await updateDoc(doc(db, "payments", id), { status: "settled", settleRef: ov.querySelector("#su").value.trim(), settledAt: serverTimestamp() }); ov.remove(); if (after) after(); }
    catch (x) { alert("Error: " + x.message); }
  };
}

/* ---------- dashboard ---------- */
async function dash() {
  V.innerHTML = "Loading...";
  const cnt = async q => (await getCountFromServer(q)).data().count;
  const days = [...Array(7)].map((_, i) => new Date(Date.now() - i * 864e5).toISOString().slice(0, 10)).reverse();
  const [u, a, p, ...d] = await Promise.all([
    cnt(collection(db, "users")), cnt(collection(db, "ads")),
    cnt(query(collection(db, "ads"), where("status", "==", "pending"))),
    ...days.map(x => cnt(query(collection(db, "daily_activity"), where("date", "==", x))))
  ]);
  const mx = Math.max(1, ...d);
  V.innerHTML = `<div class="stats"><div><b>${u}</b>Total users</div><div><b>${a}</b>Total ads</div>
  <div><b>${p}</b>Pending ads</div><div><b>${d[6]}</b>Aaj ke active users</div></div>
  <h3>Daily active users (pichhle 7 din)</h3>
  ${days.map((x, i) => `<div class="bar"><span>${x.slice(5)}</span><i style="width:${d[i] / mx * 70}%"></i> ${d[i]}</div>`).join("")}`;
}

/* ---------- ads ---------- */
async function adsTab(st) {
  V.innerHTML = `<select id="st">${["pending", "approved", "rejected", "sold"].map(x => `<option ${x === st ? "selected" : ""}>${x}</option>`).join("")}</select><div id="al">Loading...</div>`;
  $("#st").onchange = e => adsTab(e.target.value);
  const s = await getDocs(query(collection(db, "ads"), where("status", "==", st), limit(100)));
  $("#al").innerHTML = s.empty ? "<p>Is status mein koi ad nahi</p>" : s.docs.map(d => {
    const a = d.data();
    return `<div class="c"><div class="im">${(a.images || []).map(i => `<img src="${i}" alt="">`).join("")}</div>
    ${a.videoUrl ? `<video controls playsinline preload="metadata" src="${esc(a.videoUrl)}"></video>` : ""}
    <b>₹${a.price} — ${esc(a.title)}</b><p>${esc(a.description)}</p>
    <small>${esc(a.category)} • ${esc(a.city)} • Seller: ${esc(a.sellerName)}</small><div style="margin-top:8px">
    ${st !== "approved" ? `<button data-ap="${d.id}">✅ Approve</button>` : ""}
    ${st !== "rejected" ? `<button class="g" data-rj="${d.id}">❌ Reject</button>` : ""}
    <button class="g" data-dl="${d.id}">🗑 Delete</button></div></div>`;
  }).join("");
  $("#al").onclick = async e => {
    const t = e.target.dataset;
    if (t.ap) await updateDoc(doc(db, "ads", t.ap), { status: "approved", rejectReason: "" });
    else if (t.rj) { const r = prompt("Reject karne ka reason?"); if (r === null) return; await updateDoc(doc(db, "ads", t.rj), { status: "rejected", rejectReason: r }); }
    else if (t.dl) { if (!confirm("Ad delete karein?")) return; await deleteDoc(doc(db, "ads", t.dl)); }
    else return;
    adsTab(st);
  };
}

/* ---------- users ---------- */
const dtt = t => t?.toDate ? t.toDate().toLocaleDateString("en-IN") : "";
const premOn = u => (u.premiumUntil?.toMillis?.() || 0) > Date.now();
let UF = "active";
async function grantPremium(id, days) {
  const r = doc(db, "users", id), s = await getDoc(r);
  const cur = s.data()?.premiumUntil?.toMillis?.() || 0;
  await updateDoc(r, { premiumUntil: Timestamp.fromMillis(Math.max(Date.now(), cur) + days * 864e5) });
}
async function wipeUser(id) {
  const ads = await getDocs(query(collection(db, "ads"), where("userId", "==", id)));
  for (const d of ads.docs) await deleteDoc(d.ref);
  await setDoc(doc(db, "users", id), { name: "Deleted user", email: "", phone: "", city: "", upi: "", role: "user", isBlocked: true, deleted: true, permanent: true, deletedAt: serverTimestamp(), deletedBy: "admin" });
}
async function usersTab() {
  V.innerHTML = `<select id="uf"><option value="active">Active users</option><option value="deleted">Deleted users (data safe)</option><option value="all">Sab</option></select>
  <input id="uq" placeholder="Naam, email, mobile ya UPI se search karo"><div id="ul">Loading...</div>`;
  $("#uf").value = UF;
  const s = await getDocs(collection(db, "users"));
  const U = s.docs.map(d => ({ id: d.id, ...d.data() }));
  const draw = () => {
    const q = $("#uq").value.toLowerCase(), f = $("#uf").value;
    const L = U.filter(u => (f === "all" || (f === "deleted") === !!u.deleted) && ((u.name || "") + (u.email || "") + (u.phone || "") + (u.upi || "")).toLowerCase().includes(q));
    $("#ul").innerHTML = L.map(u => {
      let act = "";
      if (u.role !== "admin") {
        if (u.deleted && !u.permanent) act = `<button data-rs="${u.id}">♻️ Restore</button><button class="g" data-pd="${u.id}">❌ Permanent delete</button>`;
        else if (!u.deleted) act = `<button class="g" data-ch="${u.id}" data-nm="${esc(u.name)}">💬 Chat</button><button data-b="${u.id}">${u.isBlocked ? "✅ Unblock" : "🚫 Block"}</button><button class="g" data-dl="${u.id}">🗑 Delete</button>
          <button class="g" data-pm="${u.id}:30">⭐ +30 din</button><button class="g" data-pm="${u.id}:365">⭐ +365 din</button>${premOn(u) ? `<button class="g" data-pr="${u.id}">Premium hatao</button>` : ""}`;
      }
      return `<div class="c"><b>${esc(u.name)}</b> ${u.role === "admin" ? "(admin)" : ""} ${u.isBlocked && !u.deleted ? "🚫 Blocked" : ""}
      ${u.deleted ? (u.permanent ? "🗑 Permanently deleted" : "🗑 Deleted (" + esc(u.deletedBy || "") + ", " + dtt(u.deletedAt) + ")") : ""}${premOn(u) ? " ⭐ till " + dtt(u.premiumUntil) : ""}<br>
      <small>📧 ${esc(u.email)}</small><br><small>📱 Mobile: ${esc(u.phone) || "(nahi diya)"}</small><br>
      <small>💳 UPI: ${esc(u.upi) || "(nahi diya)"}</small><br>
      <small>📍 City: ${esc(u.city) || "(nahi diya)"} • Joined: ${dtt(u.createdAt)}</small><br>${act}</div>`;
    }).join("") || "<p>Koi user nahi</p>";
  };
  draw(); $("#uq").oninput = draw; $("#uf").onchange = () => { UF = $("#uf").value; draw(); };
  $("#ul").onclick = async e => {
    const t = e.target.dataset, ref = id => doc(db, "users", id);
    try {
      if (t.ch) { openChatWith(t.ch, t.nm); return; }
      else if (t.b) { const u = U.find(x => x.id === t.b); await updateDoc(ref(t.b), { isBlocked: !u.isBlocked }); }
      else if (t.dl) { if (!confirm("Is user ko delete karein? (Uska data admin panel mein safe rahega)")) return; await updateDoc(ref(t.dl), { deleted: true, deletedAt: serverTimestamp(), deletedBy: "admin" }); }
      else if (t.rs) { await updateDoc(ref(t.rs), { deleted: false }); }
      else if (t.pd) { if (!confirm("PERMANENT delete? User ka personal data hamesha ke liye hat jayega aur uski sabhi ads delete hongi. Ye wapas nahi hoga.")) return; await wipeUser(t.pd); alert("Permanent delete ho gaya. Poori tarah hatane ke liye Firebase console → Authentication → Users se bhi is user ko delete kar do."); }
      else if (t.pm) { const [id, days] = t.pm.split(":"); await grantPremium(id, Number(days)); }
      else if (t.pr) { await updateDoc(ref(t.pr), { premiumUntil: null }); }
      else return;
    } catch (x) { alert("Error: " + x.message); return; }
    usersTab();
  };
}

/* ---------- premium requests ---------- */
async function premTab() {
  V.innerHTML = "Loading...";
  const [rq, us] = await Promise.all([
    getDocs(query(collection(db, "premium_requests"), where("status", "==", "pending"), limit(100))),
    getDocs(collection(db, "users"))
  ]);
  const act = us.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => premOn(u) && !u.deleted);
  V.innerHTML = `<h3>Premium requests (pending)</h3>` + (rq.empty ? "<p>Koi pending request nahi</p>" : rq.docs.map(d => {
    const r = d.data();
    return `<div class="c"><b>${esc(r.name)}</b> — ${r.plan === "year" ? "Year" : "Month"} plan • ₹${r.amount}<br>
    <small>${esc(r.email)} • UTR: <b>${esc(r.ref)}</b> • ${dtt(r.createdAt)}</small><br>
    <small>⚠️ Approve se pehle apne UPI app mein ye UTR aur ₹${r.amount} check karo.</small>
    <div style="margin-top:8px"><button data-ap="${d.id}" data-uid="${r.uid}" data-days="${r.plan === "year" ? 365 : 30}">✅ Approve</button><button class="g" data-rj="${d.id}">❌ Reject</button></div></div>`;
  }).join("")) + `<h3>Active Premium users (${act.length})</h3>` + (act.map(u => `<div class="c"><b>${esc(u.name)}</b> ⭐ till ${dtt(u.premiumUntil)}<br><small>${esc(u.email)}</small></div>`).join("") || "<p>Abhi koi nahi</p>");
  V.onclick = async e => {
    const t = e.target.dataset;
    try {
      if (t.ap) { await grantPremium(t.uid, Number(t.days)); await updateDoc(doc(db, "premium_requests", t.ap), { status: "approved" }); }
      else if (t.rj) { if (!confirm("Reject karein?")) return; await updateDoc(doc(db, "premium_requests", t.rj), { status: "rejected" }); }
      else return;
    } catch (x) { alert("Error: " + x.message); return; }
    premTab();
  };
}

/* ---------- account recover requests ---------- */
async function recTab() {
  V.innerHTML = "Loading...";
  const s = await getDocs(query(collection(db, "recover_requests"), where("status", "==", "pending"), limit(100)));
  V.innerHTML = `<h3>Account recover requests</h3>` + (s.empty ? "<p>Koi pending request nahi</p>" : s.docs.map(d => {
    const r = d.data();
    return `<div class="c"><b>${esc(r.name)}</b><br><small>${esc(r.email)} • ${dtt(r.createdAt)}</small>
    <div style="margin-top:8px"><button data-ok="${d.id}">✅ Account wapas do</button><button class="g" data-no="${d.id}">❌ Reject</button></div></div>`;
  }).join(""));
  V.onclick = async e => {
    const t = e.target.dataset;
    try {
      if (t.ok) {
        const us = await getDoc(doc(db, "users", t.ok));
        if (us.data()?.permanent) { alert("Ye account permanently delete ho chuka hai, wapas nahi aa sakta."); return; }
        await updateDoc(doc(db, "users", t.ok), { deleted: false });
        await updateDoc(doc(db, "recover_requests", t.ok), { status: "approved" });
      } else if (t.no) { await updateDoc(doc(db, "recover_requests", t.no), { status: "rejected" }); }
      else return;
    } catch (x) { alert("Error: " + x.message); return; }
    recTab();
  };
}

/* ---------- categories ---------- */
async function catsTab() {
  V.innerHTML = `<input id="cn" placeholder="Nayi category ka naam"><button id="ca">Add category</button>
  <button class="g" id="cd">Default categories daalo</button><div id="cl">Loading...</div>`;
  const load = async () => {
    const s = await getDocs(collection(db, "categories"));
    $("#cl").innerHTML = s.empty ? "<p><small>Abhi koi category nahi (app default list dikhayegi)</small></p>"
      : s.docs.map(d => `<div class="c">${esc(d.data().name)} <button class="g" data-d="${d.id}" style="float:right">Delete</button></div>`).join("");
  };
  await load();
  $("#ca").onclick = async () => { const n = $("#cn").value.trim(); if (!n) return; await addDoc(collection(db, "categories"), { name: n }); $("#cn").value = ""; load(); };
  $("#cd").onclick = async () => { for (const n of DEF_CATS) await addDoc(collection(db, "categories"), { name: n }); load(); };
  $("#cl").onclick = async e => { const id = e.target.dataset.d; if (id && confirm("Delete karein?")) { await deleteDoc(doc(db, "categories", id)); load(); } };
}

/* ---------- payments ---------- */
const PF = { pending: "Verify baaki", verified: "Seller ko pay baaki", settled: "Pay ho chuka", alert: "⚠️ Delivery alert (buyer ko nahi mila)", rejected: "Rejected" };
async function payTab(st) {
  V.innerHTML = `<select id="st">${Object.entries(PF).map(([k, v]) => `<option value="${k}" ${k === st ? "selected" : ""}>${v}</option>`).join("")}</select><div id="pl">Loading...</div>`;
  $("#st").onchange = e => payTab(e.target.value);
  const q = st === "alert"
    ? query(collection(db, "payments"), where("deliveryStatus", "==", "not_received"), limit(100))
    : query(collection(db, "payments"), where("status", "==", st), limit(100));
  const [s, us] = await Promise.all([getDocs(q), getDocs(collection(db, "users"))]);
  const U = {}; us.docs.forEach(d => U[d.id] = d.data());
  const dets = {}, P = {};
  await Promise.all(s.docs.map(async d => {
    P[d.id] = d.data();
    try { const x = await getDoc(doc(db, "payments", d.id, "private", "details")); if (x.exists()) dets[d.id] = x.data(); } catch (e) {}
  }));
  $("#pl").innerHTML = s.empty ? "<p>Is section mein koi payment nahi</p>" : s.docs.map(d => {
    const p = d.data(), c = comm(p), pay = Math.round((p.amount - c) * 100) / 100, x = dets[d.id];
    const ds = p.deliveryStatus === "received" ? "✅ Buyer ne confirm kiya: product mil gaya" : p.deliveryStatus === "not_received" ? "⚠️ Buyer ko product NAHI mila. Nayi date do." : "⏳ Delivery baaki";
    return `<div class="c"><b>${esc(p.adTitle)}</b> — ₹${p.amount}<br>
    <small>Buyer: ${esc(p.buyerName)} → Seller: ${esc(p.sellerName)} • ${dt(p)}</small><br>
    <small>Method: ${esc(p.method)} • ID: <b>${esc(p.ref)}</b></small><br>
    Meri commission (${p.commissionPercent}%): <b>₹${c}</b> • Seller ko dena: <b>₹${pay}</b><br>
    <small>Seller UPI: ${esc(U[p.sellerId]?.upi || "(seller ne UPI nahi diya)")} • Seller mobile: ${esc(U[p.sellerId]?.phone || "-")}</small><br>
    ${x ? `<div style="background:#eef0f6;border-radius:8px;padding:8px;margin:6px 0"><b>📦 Buyer ki details</b><br>👤 ${esc(x.name)} • 📱 ${esc(x.phone)}<br>📍 Location: ${esc(x.city)}, ${esc(x.district)}, ${esc(x.state)} - ${esc(x.pin)}<br>🚚 Delivery: ${esc(x.address)}<br>Landmark: ${esc(x.landmark)}${x.gps ? ` • <a href="https://www.google.com/maps?q=${x.gps.lat},${x.gps.lng}" target="_blank">Map</a>` : ""}</div>` : "<small>(Buyer ki details nahi mili)</small><br>"}
    ${p.deliveryDate ? `<small>📅 Delivery date: <b>${fmtD(p.deliveryDate)}</b> • ${ds}</small><br>` : ""}
    ${p.status === "pending" ? `<small>⚠️ Verify se pehle apne UPI app mein ye ID (${esc(p.ref)}) aur ₹${p.amount} check karo.</small>` : ""}
    <div style="margin-top:8px">
    ${p.status === "pending" ? `<button data-vf="${d.id}">✅ Verify + delivery date</button><button class="g" data-rj="${d.id}">❌ Reject</button>` : ""}
    ${p.status === "verified" ? `<button data-pay="${d.id}">💸 Seller ko pay karo</button>` : ""}
    ${(p.status === "verified" || p.status === "settled") && p.deliveryStatus !== "received" ? `<button class="g" data-nd="${d.id}">📅 ${p.deliveryStatus === "not_received" ? "Nayi date do" : "Date badlo"}</button>` : ""}
    <button class="g" data-cb="${d.id}">💬 Buyer se chat</button><button class="g" data-cs="${d.id}">💬 Seller se chat</button></div></div>`;
  }).join("");
  $("#pl").onclick = async e => {
    const t = e.target.dataset, id = t.vf || t.rj || t.pay || t.nd || t.cb || t.cs, p = P[id];
    if (!id) return;
    try {
      if (t.vf) {
        const d = await askDate("Product buyer ko kab tak milega? (delivery date)"); if (!d) return;
        await updateDoc(doc(db, "payments", t.vf), { status: "verified", deliveryDate: d, deliveryStatus: "pending", dateHistory: arrayUnion({ date: d, at: Timestamp.now() }) });
        try { await updateDoc(doc(db, "ads", p.adId), { status: "sold" }); } catch (x) {}
      } else if (t.rj) { if (!confirm("Payment reject karein?")) return; await updateDoc(doc(db, "payments", t.rj), { status: "rejected" }); }
      else if (t.pay) { paySellerSheet(t.pay, p, U[p.sellerId], () => payTab(st)); return; }
      else if (t.nd) {
        const d = await askDate("Nayi delivery date", p.deliveryDate); if (!d) return;
        await updateDoc(doc(db, "payments", t.nd), { deliveryDate: d, deliveryStatus: "pending", dateHistory: arrayUnion({ date: d, at: Timestamp.now() }) });
      }
      else if (t.cb) { openChatWith(p.buyerId, p.buyerName); return; }
      else if (t.cs) { openChatWith(p.sellerId, p.sellerName); return; }
    } catch (x) { alert("Error: " + x.message); return; }
    payTab(st);
  };
}

/* ---------- earnings ---------- */
async function earnTab() {
  V.innerHTML = "Loading...";
  const s = await getDocs(query(collection(db, "payments"), where("status", "in", ["verified", "settled"]), limit(500)));
  const L = s.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  const total = L.reduce((x, p) => x + comm(p), 0), sales = L.reduce((x, p) => x + p.amount, 0);
  V.innerHTML = `<div class="stats"><div><b>₹${Math.round(total * 100) / 100}</b>Meri total commission</div><div><b>₹${sales}</b>Total sales (verified)</div></div>
  <h3>Kis product se kitna mila</h3>
  ${L.length ? L.map(p => `<div class="c"><b>${esc(p.adTitle)}</b><br>Sale: ₹${p.amount} • Meri commission (${p.commissionPercent}%): <b>₹${comm(p)}</b><br>
  <small>${esc(p.buyerName)} → ${esc(p.sellerName)} • ${dt(p)}</small></div>`).join("") : "<p>Abhi koi verified payment nahi</p>"}`;
}

/* ---------- chats (read only) ---------- */
const nms = c => c.names ? Object.values(c.names).map(esc).join(" ↔ ") : `${esc(c.buyerName)} ↔ ${esc(c.sellerName)}`;
const sender = (c, uid) => c.names ? (c.names[uid] || "User") : (uid === c.buyerId ? c.buyerName + " (buyer)" : c.sellerName + " (seller)");
const mh = (m, nm) => `<small>${esc(nm)}</small><br>` + (m.type === "ad"
  ? `<div class="msg">📎 Ad: ${esc(m.adTitle)} — ₹${m.adPrice}</div>`
  : m.type === "video" ? `<div class="msg"><video controls playsinline preload="metadata" src="${esc(m.url)}"></video></div>`
  : m.type === "img" ? `<div class="msg"><img src="${m.img}" style="max-width:200px;border-radius:8px" alt=""></div>`
  : `<div class="msg">${esc(m.text)}</div>`) + "<br>";
async function chatsTab() {
  V.innerHTML = "Loading...";
  const s = await getDocs(query(collection(db, "chats"), limit(200)));
  const L = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.lastMessage)
    .sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
  V.innerHTML = L.length ? L.map(c => `<div class="c"><b>${nms(c)}</b><br><small>${esc(c.adTitle)}</small><br>${esc(c.lastMessage)}<br>
  <button data-o="${c.id}">Poori chat dekho</button></div>`).join("") : "<p>Abhi koi chat nahi</p>";
  V.onclick = async e => {
    const id = e.target.dataset.o; if (!id) return;
    const c = L.find(x => x.id === id);
    const m = await getDocs(query(collection(db, "chats", id, "messages"), orderBy("createdAt")));
    V.onclick = null;
    V.innerHTML = `<button class="g" id="bk">← Wapas</button><h3>${nms(c)}</h3><small>${esc(c.adTitle)}</small><div style="margin-top:10px">
    ${m.docs.map(d => { const x = d.data(); return mh(x, sender(c, x.from)); }).join("")}</div>`;
    $("#bk").onclick = chatsTab;
  };
}

/* ---------- settings ---------- */
async function setTab() {
  const s = await getDoc(doc(db, "settings", "app"));
  const d = { upiId: "", upiName: "Vendor", razorpayKey: "", commission: 5, cloudinaryCloud: "", cloudinaryPreset: "", premiumMonth: 50, premiumYear: 600, ...(s.exists() ? s.data() : {}) };
  V.innerHTML = `<h3>Payment Settings</h3>
  <label>Aapka UPI ID (buyer ka paisa yahan aayega)</label><input id="s1" value="${esc(d.upiId)}" placeholder="naam@upi">
  <label>UPI par dikhne wala naam</label><input id="s2" value="${esc(d.upiName)}">
  <label>Razorpay Key ID (optional, online payment ke liye. Pehle rzp_test_ wali key se test karo)</label><input id="s3" value="${esc(d.razorpayKey)}" placeholder="rzp_test_xxxxxxxx">
  <label>Meri commission (%)</label><input id="s4" type="number" value="${d.commission}">
  <h3>Premium aur Video</h3>
  <label>Premium price: 1 month (₹)</label><input id="s7" type="number" value="${d.premiumMonth}">
  <label>Premium price: 1 year (₹)</label><input id="s8" type="number" value="${d.premiumYear}">
  <label>Cloudinary Cloud name (video upload ke liye)</label><input id="s5" value="${esc(d.cloudinaryCloud)}" placeholder="jaise: dxxxxxxxx">
  <label>Cloudinary Upload preset (Unsigned wala)</label><input id="s6" value="${esc(d.cloudinaryPreset)}" placeholder="jaise: vendor_videos">
  <button id="sv">Save settings</button>`;
  $("#sv").onclick = async () => {
    const c = Number($("#s4").value), pm = Number($("#s7").value), py = Number($("#s8").value);
    if (isNaN(c) || c < 0 || c > 50) return alert("Commission 0 se 50 ke beech rakho");
    if (!(pm > 0) || !(py > 0)) return alert("Premium price sahi daalo");
    await setDoc(doc(db, "settings", "app"), { upiId: $("#s1").value.trim(), upiName: $("#s2").value.trim() || "Vendor", razorpayKey: $("#s3").value.trim(), commission: c, premiumMonth: pm, premiumYear: py, cloudinaryCloud: $("#s5").value.trim(), cloudinaryPreset: $("#s6").value.trim() });
    alert("Settings save ho gayi");
  };
}
